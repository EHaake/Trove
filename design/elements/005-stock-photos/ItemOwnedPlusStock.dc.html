<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{--bg:#17181A;--surface:#201F1D;--inset:#26272A;--divider:#3A3B3E;--brass:#C79A56;--mossText:#7E9679;}
    helmet{display:none!important;}
    x-dc{display:block;}
    body{background:var(--bg);font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;color:#F2EDE4;-webkit-font-smoothing:antialiased;}
    .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;}
    .disp{font-family:'Archivo',system-ui,sans-serif;font-weight:600;}
    a{color:var(--brass);text-decoration:none;}
    .frame{width:390px;height:844px;background:var(--bg);position:relative;overflow:hidden;}
    .plate{background:var(--surface);border-radius:3px;box-shadow:inset 0 1px 0 rgba(242,237,228,0.055),inset 0 -1px 0 rgba(0,0,0,0.4),0 2px 6px rgba(0,0,0,0.25);}
    .hero{position:relative;height:240px;border-radius:3px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(242,237,228,0.055),inset 0 -1px 0 rgba(0,0,0,0.4),0 2px 6px rgba(0,0,0,0.25);}
    .badge{position:absolute;top:12px;left:12px;display:inline-flex;align-items:center;gap:5px;padding:5px 9px 5px 8px;border-radius:999px;background:rgba(23,24,26,0.9);border:1px solid rgba(242,237,228,0.14);white-space:nowrap;}
    .badge .t{font-family:'IBM Plex Mono';font-weight:500;font-size:10px;letter-spacing:0.12em;color:rgba(242,237,228,0.75);}
    .dots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:6px;}
    .dot{width:6px;height:6px;border-radius:999px;background:rgba(242,237,228,0.45);}
    .dot.on{background:var(--brass);}
    .statpair{display:flex;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,0.25);overflow:hidden;background:var(--divider);gap:1px;}
    .sc{flex:1;background:var(--surface);padding:15px 16px;box-shadow:inset 0 1px 0 rgba(242,237,228,0.055),inset 0 -1px 0 rgba(0,0,0,0.4);}
    .slab{font-size:10px;font-weight:600;letter-spacing:0.14em;color:rgba(242,237,228,0.5);}
  </style>
</helmet>

<div class="frame">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="gtr" viewBox="0 0 120 120">
      <rect x="55" y="6" width="10" height="48" rx="2" fill="#3a2f22"/>
      <rect x="52" y="3" width="16" height="11" rx="2" fill="#281f17"/>
      <path d="M42 52 q-17 3 -17 27 q0 25 21 31 q18 5 33 0 q18 -6 18 -31 q0 -25 -18 -27 q-7 -1 -14 -1 q-4 -4 -10 -4 q-8 0 -16 6 z" fill="#c19a5b"/>
      <path d="M45 61 q-6 7 -4 22 q2 12 14 14 l9 -2 q-6 -20 -4 -34 z" fill="#1c1b1a"/>
      <rect x="66" y="76" width="14" height="10" rx="1" fill="#8a8a8a"/>
      <path d="M58 10 L70 82 M61 10 L74 82" stroke="rgba(242,237,228,0.22)" stroke-width="0.7"/>
    </symbol>
  </defs></svg>

  <div style="height:44px"></div>
  <div style="height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;">
    <div style="display:flex;align-items:center;gap:5px;color:var(--brass);font-size:17px;"><span style="font-size:22px;line-height:1">‹</span><span>Items</span></div>
    <div style="color:var(--brass);font-size:22px;letter-spacing:1.5px;">···</div>
  </div>

  <div style="padding:18px 24px 48px;">
    <!-- pager: photo 1 = the person's OWN photo (no badge, no credit); photo 2 = kept stock (badged), peeking -->
    <div class="hero">
      <div style="display:flex;height:100%;">
        <div style="flex:0 0 298px;height:100%;position:relative;background:#332f2a;">
          <svg viewBox="16 40 88 56" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"><use href="#gtr" width="120" height="120"/></svg>
        </div>
        <div style="flex:0 0 130px;height:100%;position:relative;background:#e7e4dd;margin-left:6px;">
          <svg viewBox="16 40 88 56" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"><use href="#gtr" width="120" height="120"/></svg>
          <div class="badge">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="rgba(242,237,228,0.72)" stroke-width="1.4" stroke-linejoin="round"><rect x="2.4" y="5" width="8.4" height="7" rx="1.4"/><path d="M5.3 5V3.6A1.1 1.1 0 0 1 6.4 2.5h6A1.1 1.1 0 0 1 13.5 3.6v6A1.1 1.1 0 0 1 12.4 10.7h-1.6"/></svg>
            <span class="t">STOCK PHOTO</span>
          </div>
        </div>
      </div>
      <div class="dots"><span class="dot on"></span><span class="dot"></span></div>
    </div>

    <div style="margin-top:24px;">
      <div class="mono" style="font-size:10.5px;letter-spacing:0.12em;color:rgba(242,237,228,0.45);">FENDER · GUITARS</div>
      <div class="disp" style="font-size:27px;line-height:1.1;letter-spacing:-0.01em;margin-top:8px;">Fender Stratocaster</div>
    </div>

    <div class="statpair" style="margin-top:24px;">
      <div class="sc">
        <div class="slab">WORTH NOW</div>
        <div class="disp" style="font-size:25px;color:var(--brass);margin-top:7px;">$1,300</div>
      </div>
      <div class="sc">
        <div class="slab">PAID</div>
        <div class="mono" style="font-size:19px;font-weight:500;margin-top:7px;">$1,150</div>
        <div class="mono" style="font-size:11px;color:var(--mossText);margin-top:7px;">+$150 · +13%</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{--bg:#17181A;--surface:#201F1D;--inset:#26272A;--divider:#3A3B3E;--brass:#C79A56;--brassHover:#DDB877;--mossText:#7E9679;}
    helmet{display:none!important;}
    x-dc{display:block;}
    body{background:var(--bg);font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;color:#F2EDE4;-webkit-font-smoothing:antialiased;}
    .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;}
    .disp{font-family:'Archivo',system-ui,sans-serif;font-weight:600;}
    a{color:var(--brass);text-decoration:none;}
    .frame{width:390px;height:844px;background:var(--bg);position:relative;overflow:hidden;}
    .plate{background:var(--surface);border-radius:3px;box-shadow:inset 0 1px 0 rgba(242,237,228,0.055),inset 0 -1px 0 rgba(0,0,0,0.4),0 2px 6px rgba(0,0,0,0.25);}
    .hero{position:relative;height:240px;border-radius:3px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(242,237,228,0.055),inset 0 -1px 0 rgba(0,0,0,0.4),0 2px 6px rgba(0,0,0,0.25);}
    .badge{position:absolute;top:12px;left:12px;display:inline-flex;align-items:center;gap:5px;padding:5px 9px 5px 8px;border-radius:999px;background:rgba(23,24,26,0.9);border:1px solid rgba(242,237,228,0.14);}
    .badge .t{font-family:'IBM Plex Mono';font-weight:500;font-size:10px;letter-spacing:0.12em;color:rgba(242,237,228,0.75);}
    .credit{font-size:12.5px;line-height:1.5;color:rgba(242,237,228,0.55);margin-top:12px;}
    .credit .lic{font-size:11.5px;color:rgba(242,237,228,0.45);}
    .credit .wm{color:var(--brass);font-weight:500;white-space:nowrap;}
    .credit .wm svg{vertical-align:-1px;margin-left:2px;}
    .statpair{display:flex;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,0.25);overflow:hidden;background:var(--divider);gap:1px;}
    .sc{flex:1;background:var(--surface);padding:15px 16px;box-shadow:inset 0 1px 0 rgba(242,237,228,0.055),inset 0 -1px 0 rgba(0,0,0,0.4);}
    .slab{font-size:10px;font-weight:600;letter-spacing:0.14em;color:rgba(242,237,228,0.5);}
    .desire{padding:20px 18px;}
  </style>
</helmet>

<div class="frame">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="hb" viewBox="0 0 120 120">
      <rect x="34" y="34" width="52" height="56" rx="4" fill="#33323a"/>
      <rect x="34" y="26" width="52" height="12" rx="2" fill="#26252b"/>
      <rect x="34" y="60" width="52" height="16" fill="#2a2930"/>
      <circle cx="60" cy="66" r="20" fill="#17161a"/>
      <circle cx="60" cy="66" r="20" fill="none" stroke="#565560" stroke-width="3"/>
      <circle cx="60" cy="66" r="10" fill="#0d0c10"/>
      <circle cx="54" cy="60" r="3" fill="rgba(242,237,228,0.16)"/>
      <rect x="84" y="44" width="10" height="30" rx="2" fill="#3a3940"/>
      <circle cx="41" cy="44" r="3.5" fill="#8a8a90"/>
    </symbol>
  </defs></svg>

  <div style="height:44px"></div>
  <div style="height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;">
    <div style="display:flex;align-items:center;gap:5px;color:var(--brass);font-size:17px;"><span style="font-size:22px;line-height:1">‹</span><span>Items</span></div>
    <div style="color:var(--brass);font-size:22px;letter-spacing:1.5px;">···</div>
  </div>

  <div style="padding:18px 24px 48px;">
    <!-- stock-photo hero (only image) over a LIGHT product shot -->
    <div class="hero" style="background:#EDEBE6;">
      <svg viewBox="24 20 72 80" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"><use href="#hb" width="120" height="120"/></svg>
      <div class="badge">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="rgba(242,237,228,0.72)" stroke-width="1.4" stroke-linejoin="round"><rect x="2.4" y="5" width="8.4" height="7" rx="1.4"/><path d="M5.3 5V3.6A1.1 1.1 0 0 1 6.4 2.5h6A1.1 1.1 0 0 1 13.5 3.6v6A1.1 1.1 0 0 1 12.4 10.7h-1.6"/></svg>
        <span class="t">STOCK PHOTO</span>
      </div>
    </div>
    <div class="credit">Photo: <span>Rama</span> · <span class="lic mono">CC BY-SA 3.0</span> · <a class="wm" href="#">Wikimedia Commons<svg width="11" height="11" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14L14 6"/><path d="M7 6h7v7"/></svg></a></div>

    <div style="margin-top:24px;">
      <div class="mono" style="font-size:10.5px;letter-spacing:0.12em;color:rgba(242,237,228,0.45);">HASSELBLAD · CAMERAS</div>
      <div class="disp" style="font-size:27px;line-height:1.1;letter-spacing:-0.01em;margin-top:8px;">Hasselblad 500C/M</div>
    </div>

    <div class="statpair" style="margin-top:24px;">
      <div class="sc">
        <div class="slab">WORTH NOW</div>
        <div class="disp" style="font-size:25px;color:var(--brass);margin-top:7px;">$1,780</div>
      </div>
      <div class="sc">
        <div class="slab">PAID</div>
        <div class="mono" style="font-size:19px;font-weight:500;margin-top:7px;">$1,250</div>
        <div class="mono" style="font-size:11px;color:var(--mossText);margin-top:7px;">+$530 · +42%</div>
      </div>
    </div>

    <div class="plate desire" style="margin-top:24px;display:flex;align-items:center;gap:20px;">
      <div style="position:relative;width:120px;height:120px;flex:0 0 120px;">
        <svg width="120" height="120" viewBox="0 0 120 120"><path d="M34 96 A40 40 0 1 1 86 96" fill="none" stroke="#7E9679" stroke-width="3" stroke-linecap="round"/><circle cx="86" cy="96" r="5" fill="#7E9679"/></svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;"><span class="disp" style="font-size:40px;color:#7E9679;line-height:1;">5</span><span class="mono" style="font-size:10px;letter-spacing:0.1em;color:rgba(242,237,228,0.45);">OF 5</span></div>
      </div>
      <div style="flex:1;">
        <div style="font-size:11px;font-weight:600;letter-spacing:0.16em;color:rgba(242,237,228,0.55);">DESIRE TO KEEP</div>
        <div style="font-size:14px;font-weight:500;margin-top:10px;">Absolutely keeping it</div>
        <div style="font-size:12px;line-height:1.45;color:rgba(242,237,228,0.55);margin-top:4px;">Never offered up. This one stays.</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>

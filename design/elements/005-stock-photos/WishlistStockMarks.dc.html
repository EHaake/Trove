<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{--bg:#17181A;--surface:#201F1D;--inset:#26272A;--divider:#3A3B3E;--brass:#C79A56;--brassTint:rgba(199,154,86,0.12);--brassDim:#746140;--brassMid:#A07E48;}
    helmet{display:none!important;}
    x-dc{display:block;}
    body{background:var(--bg);font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;color:#F2EDE4;-webkit-font-smoothing:antialiased;}
    .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;}
    .disp{font-family:'Archivo',system-ui,sans-serif;font-weight:600;}
    .frame{width:390px;height:844px;background:var(--bg);position:relative;overflow:hidden;}
    .plate{background:var(--surface);border-radius:3px;box-shadow:inset 0 1px 0 rgba(242,237,228,0.055),inset 0 -1px 0 rgba(0,0,0,0.4),0 2px 6px rgba(0,0,0,0.25);}
    .row{display:flex;align-items:center;gap:13px;padding:13px;margin-bottom:10px;}
    .thumb{position:relative;width:52px;height:52px;flex:0 0 52px;border-radius:2px;overflow:hidden;background:var(--inset);}
    .thumb .pic{width:100%;height:100%;display:block;}
    .ph-glyph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
    .mark{position:absolute;top:4px;left:4px;width:16px;height:16px;border-radius:3px;background:rgba(23,24,26,0.9);border:1px solid rgba(242,237,228,0.16);display:flex;align-items:center;justify-content:center;}
    .rbody{flex:1;min-width:0;}
    .rtitle{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .rmeta{font-size:10.5px;letter-spacing:0.08em;color:rgba(242,237,228,0.45);margin-top:3px;}
    .rcost{font-size:16px;font-weight:500;margin-top:6px;}
    .gauge{display:flex;align-items:flex-end;gap:4px;flex:0 0 auto;}
    .glabel{font-size:8.5px;letter-spacing:0.12em;color:rgba(242,237,228,0.35);margin-right:3px;line-height:1;font-family:'IBM Plex Mono';align-self:flex-end;}
    .seg{width:12px;display:inline-block;transform:skewX(-12deg);border-radius:1px;}
    .seg.off{border:1px solid rgba(242,237,228,0.16);}
    .chip{border:1px solid var(--divider);border-radius:999px;padding:8px 17px;font-size:14px;font-weight:500;color:rgba(242,237,228,0.75);}
    .chip.on{border-color:var(--brass);color:var(--brass);background:var(--brassTint);}
    .sbadge{border:1px solid var(--brass);border-radius:3px;padding:8px 12px;display:flex;align-items:center;gap:8px;color:var(--brass);}
  </style>
</helmet>

<div class="frame">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="rf" viewBox="0 0 120 120"><rect x="18" y="46" width="84" height="42" rx="6" fill="#3a3940"/><rect x="18" y="38" width="84" height="12" rx="3" fill="#4a4951"/><rect x="18" y="58" width="84" height="20" fill="#2c2b31"/><circle cx="60" cy="68" r="20" fill="#1c1b20"/><circle cx="60" cy="68" r="20" fill="none" stroke="#5a5962" stroke-width="3"/><circle cx="60" cy="68" r="10" fill="#111015"/><rect x="26" y="40" width="12" height="7" rx="1" fill="#8a8a90"/><circle cx="90" cy="42" r="6" fill="#5a5962"/></symbol>
    <symbol id="gtr" viewBox="0 0 120 120"><rect x="55" y="6" width="10" height="48" rx="2" fill="#3a2f22"/><rect x="52" y="3" width="16" height="11" rx="2" fill="#281f17"/><path d="M42 52 q-17 3 -17 27 q0 25 21 31 q18 5 33 0 q18 -6 18 -31 q0 -25 -18 -27 q-7 -1 -14 -1 q-4 -4 -10 -4 q-8 0 -16 6 z" fill="#c19a5b"/><path d="M45 61 q-6 7 -4 22 q2 12 14 14 l9 -2 q-6 -20 -4 -34 z" fill="#1c1b1a"/><rect x="66" y="76" width="14" height="10" rx="1" fill="#8a8a8a"/></symbol>
    <symbol id="tt" viewBox="0 0 120 120"><rect x="12" y="18" width="96" height="84" rx="4" fill="#2a2722"/><circle cx="54" cy="60" r="34" fill="#18171b"/><circle cx="54" cy="60" r="34" fill="none" stroke="#3a3a3c" stroke-width="1.5"/><circle cx="54" cy="60" r="12" fill="#b58a4a"/><circle cx="96" cy="30" r="6" fill="#3a3940"/><path d="M96 30 L64 66" stroke="#8a8a90" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="mk" viewBox="0 0 16 16"><rect x="2.4" y="5" width="8.4" height="7" rx="1.4" fill="none" stroke="rgba(242,237,228,0.72)" stroke-width="1.4" stroke-linejoin="round"/><path d="M5.3 5V3.6A1.1 1.1 0 0 1 6.4 2.5h6A1.1 1.1 0 0 1 13.5 3.6v6A1.1 1.1 0 0 1 12.4 10.7h-1.6" fill="none" stroke="rgba(242,237,228,0.72)" stroke-width="1.4" stroke-linejoin="round"/></symbol>
  </defs></svg>

  <div style="height:44px"></div>
  <div style="padding:14px 24px 0;display:flex;align-items:flex-start;justify-content:space-between;">
    <div>
      <div class="disp" style="font-size:30px;">Wishlist</div>
      <div class="mono" style="font-size:12.5px;letter-spacing:0.04em;color:rgba(242,237,228,0.45);margin-top:6px;">4 WANTED · $3,980</div>
    </div>
    <div class="sbadge">
      <span style="display:flex;flex-direction:column;gap:2.5px;"><span style="width:10px;height:1.5px;background:currentColor;"></span><span style="width:7px;height:1.5px;background:currentColor;"></span><span style="width:4px;height:1.5px;background:currentColor;"></span></span>
      <span class="mono" style="font-size:11px;">Cost</span>
    </div>
  </div>

  <div style="padding:16px 0 4px 24px;display:flex;gap:10px;overflow:hidden;">
    <span class="chip on">All</span><span class="chip">Cameras</span><span class="chip">Lenses</span><span class="chip">Guitars</span>
  </div>

  <div style="padding:14px 24px 0;">
    <!-- STOCK photo — marked -->
    <div class="row plate">
      <div class="thumb"><svg class="pic" viewBox="10 24 100 74" preserveAspectRatio="xMidYMid slice"><use href="#rf" width="120" height="120"/></svg><div class="mark"><svg width="10" height="10" viewBox="0 0 16 16"><use href="#mk"/></svg></div></div>
      <div class="rbody">
        <div class="rtitle">Leica M6</div>
        <div class="rmeta mono">CAMERAS</div>
        <div class="rcost mono">$1,180</div>
      </div>
      <div class="gauge"><span class="glabel">DESIRE</span><span class="seg" style="height:8px;background:#746140"></span><span class="seg" style="height:11px;background:#A07E48"></span><span class="seg" style="height:14px;background:#C79A56"></span></div>
    </div>

    <!-- STOCK photo — marked -->
    <div class="row plate">
      <div class="thumb"><svg class="pic" viewBox="18 40 84 58" preserveAspectRatio="xMidYMid slice"><use href="#gtr" width="120" height="120"/></svg><div class="mark"><svg width="10" height="10" viewBox="0 0 16 16"><use href="#mk"/></svg></div></div>
      <div class="rbody">
        <div class="rtitle">Fender Telecaster</div>
        <div class="rmeta mono">GUITARS</div>
        <div class="rcost mono">$1,150</div>
      </div>
      <div class="gauge"><span class="glabel">DESIRE</span><span class="seg" style="height:8px;background:#746140"></span><span class="seg" style="height:11px;background:#A07E48"></span><span class="seg off" style="height:14px;"></span></div>
    </div>

    <!-- STOCK photo — marked -->
    <div class="row plate">
      <div class="thumb"><svg class="pic" viewBox="8 18 104 84" preserveAspectRatio="xMidYMid slice"><use href="#tt" width="120" height="120"/></svg><div class="mark"><svg width="10" height="10" viewBox="0 0 16 16"><use href="#mk"/></svg></div></div>
      <div class="rbody">
        <div class="rtitle">Rega Planar 3</div>
        <div class="rmeta mono">HI-FI</div>
        <div class="rcost mono">$600</div>
      </div>
      <div class="gauge"><span class="glabel">DESIRE</span><span class="seg" style="height:8px;background:#746140"></span><span class="seg off" style="height:11px;"></span><span class="seg off" style="height:14px;"></span></div>
    </div>

    <!-- NO photo yet — placeholder, no mark -->
    <div class="row plate">
      <div class="thumb"><div class="ph-glyph"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(242,237,228,0.3)" stroke-width="1.4"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="8.4" cy="9.6" r="1.5"/><path d="M4.5 16l4.3-4 3 2.8 2.5-2.3 5.2 4.7"/></svg></div></div>
      <div class="rbody">
        <div class="rtitle">Vox AC15 Custom</div>
        <div class="rmeta mono">AMPS</div>
        <div class="rcost mono">$1,050</div>
      </div>
      <div class="gauge"><span class="glabel">DESIRE</span><span class="seg" style="height:8px;background:#746140"></span><span class="seg" style="height:11px;background:#A07E48"></span><span class="seg off" style="height:14px;"></span></div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>

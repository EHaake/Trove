<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{--bg:#17181A;--surface:#201F1D;--inset:#26272A;--divider:#3A3B3E;--brass:#C79A56;--brassHover:#DDB877;}
    helmet{display:none!important;}
    x-dc{display:block;}
    body{background:var(--bg);font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;color:#F2EDE4;-webkit-font-smoothing:antialiased;}
    .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;}
    .disp{font-family:'Archivo',system-ui,sans-serif;font-weight:600;}
    .frame{width:390px;height:844px;background:var(--bg);position:relative;overflow:hidden;}
    .plate{background:var(--surface);border-radius:3px;box-shadow:inset 0 1px 0 rgba(242,237,228,0.055),inset 0 -1px 0 rgba(0,0,0,0.4),0 2px 6px rgba(0,0,0,0.25);}
    .scrim{position:absolute;inset:0;background:rgba(0,0,0,0.45);}
    .sheet{position:absolute;left:0;right:0;bottom:0;top:140px;background:var(--bg);border-radius:12px 12px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,0.5);}
    .grab{width:36px;height:5px;border-radius:3px;background:rgba(242,237,228,0.3);margin:8px auto 0;}
    .again{border:1px solid var(--brass);color:var(--brass);border-radius:999px;height:44px;padding:0 26px;display:inline-flex;align-items:center;font-weight:500;font-size:13.5px;}
  </style>
</helmet>

<div class="frame">
  <div class="bd">
    <div style="height:44px"></div>
    <div style="height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;">
      <div style="display:flex;align-items:center;gap:5px;color:var(--brass);font-size:17px;"><span style="font-size:22px;line-height:1">‹</span><span>Wishlist</span></div>
      <div style="color:var(--brass);font-size:22px;letter-spacing:1.5px;">···</div>
    </div>
    <div style="padding:8px 24px 0;">
      <div class="mono" style="font-size:10.5px;letter-spacing:0.12em;color:rgba(242,237,228,0.45);">WANTED · CAMERAS</div>
      <div class="disp" style="font-size:27px;line-height:1.12;margin-top:8px;">Leica M6</div>
    </div>
  </div>
  <div class="scrim"></div>

  <div class="sheet">
    <div class="grab"></div>
    <div style="position:relative;height:52px;display:flex;align-items:center;padding:0 24px;margin-top:4px;">
      <div style="color:var(--brass);font-size:17px;">Cancel</div>
      <div class="disp" style="position:absolute;left:0;right:0;text-align:center;font-size:20px;">Choose a photo</div>
    </div>
    <div style="padding:0 24px;">
      <div class="plate" style="height:40px;display:flex;align-items:center;gap:10px;padding:0 14px;">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="rgba(242,237,228,0.4)" stroke-width="1.8"><circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/></svg>
        <span style="font-size:13.5px;color:#F2EDE4;flex:1;">Leica M6</span>
        <svg width="18" height="18" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="rgba(242,237,228,0.16)"/><path d="M7 7l6 6M13 7l-6 6" stroke="rgba(242,237,228,0.6)" stroke-width="1.6" fill="none"/></svg>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 40px;margin-top:130px;">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="rgba(242,237,228,0.3)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7.5 18h8.2a3.4 3.4 0 0 0 .5-6.77A5 5 0 0 0 7.6 9.3 3.9 3.9 0 0 0 7.5 18z"/>
        <path d="M4.2 4.2l15.6 15.6"/>
      </svg>
      <div class="disp" style="font-size:19px;line-height:1.28;margin-top:20px;max-width:260px;">Couldn&rsquo;t reach Wikimedia Commons. Try again in a while.</div>
      <div style="margin-top:22px;"><span class="again">Search again</span></div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>

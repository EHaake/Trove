<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    helmet{display:none!important;}
    x-dc{display:block;}
    body{background:#17181A;font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;color:#F2EDE4;-webkit-font-smoothing:antialiased;}
    a{color:#C79A56;text-decoration:none;}
    a:hover{color:#DDB877;}
    .frame{width:390px;background:#17181A;position:relative;overflow:hidden;}
    .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;}
    .disp{font-family:'Archivo',system-ui,sans-serif;font-weight:600;}
    .lbl{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;font-weight:500;font-size:10.5px;line-height:14px;letter-spacing:1.2px;text-transform:uppercase;color:rgba(242,237,228,0.6);white-space:nowrap;}
    .meta{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;font-size:11.5px;line-height:16px;white-space:nowrap;}
    .money{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;font-size:15px;line-height:20px;font-weight:500;white-space:nowrap;}
    .plate{background:#201F1D;border-radius:3px;box-shadow:inset 0 1px 0 rgba(242,237,228,0.055),inset 0 -1px 0 rgba(0,0,0,0.4),0 2px 6px rgba(0,0,0,0.25);}
    .badge{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid #C79A56;border-radius:3px;color:#C79A56;}
    .sw{display:inline-flex;height:32px;border:1px solid #C79A56;border-radius:3px;overflow:hidden;}
    .sw span{width:62px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;font-size:11px;}
    .sw .on{background:#C79A56;color:#17181A;font-weight:500;}
    .sw .off{color:#C79A56;}
    .chip{border:1px solid #3A3B3E;border-radius:999px;padding:9px 14px;font-size:12.5px;line-height:16px;color:rgba(242,237,228,0.75);white-space:nowrap;}
    .chip.on{border-color:#C79A56;color:#C79A56;background:rgba(199,154,86,0.12);}
    .row{display:flex;align-items:center;gap:13px;padding:13px;}
    .thumb{position:relative;width:52px;height:52px;flex:0 0 52px;border-radius:2px;overflow:hidden;background:#26272A;display:flex;align-items:center;justify-content:center;}
    .thumb .pic{position:absolute;inset:0;width:100%;height:100%;}
    .rbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
    .rtitle{font-size:15px;font-weight:500;line-height:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .rvalue{display:flex;align-items:baseline;gap:8px;}
    .dial{position:relative;width:36px;height:36px;flex:0 0 36px;}
    .dial span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Archivo',system-ui,sans-serif;font-weight:600;font-size:11px;}
  </style>
</helmet>

<div class="frame" style="height:430px;">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="hb" viewBox="0 0 120 120"><rect x="34" y="34" width="52" height="56" rx="4" fill="#33323a"/><rect x="34" y="26" width="52" height="12" rx="2" fill="#26252b"/><rect x="34" y="60" width="52" height="16" fill="#2a2930"/><circle cx="60" cy="66" r="20" fill="#17161a"/><circle cx="60" cy="66" r="20" fill="none" stroke="#565560" stroke-width="3"/><circle cx="60" cy="66" r="10" fill="#0d0c10"/><rect x="84" y="44" width="10" height="30" rx="2" fill="#3a3940"/><circle cx="41" cy="44" r="3.5" fill="#8a8a90"/></symbol>
    <symbol id="lens" viewBox="0 0 120 120"><rect x="30" y="40" width="60" height="46" rx="6" fill="#2b2a30"/><rect x="30" y="40" width="60" height="46" rx="6" fill="none" stroke="#55545d" stroke-width="2"/><rect x="40" y="40" width="3" height="46" fill="#3a3940"/><rect x="50" y="40" width="3" height="46" fill="#3a3940"/><rect x="70" y="40" width="3" height="46" fill="#3a3940"/><rect x="80" y="40" width="3" height="46" fill="#3a3940"/><ellipse cx="60" cy="63" rx="18" ry="16" fill="#14141a"/><ellipse cx="60" cy="63" rx="18" ry="16" fill="none" stroke="#5a5962" stroke-width="2"/></symbol>
  </defs></svg>

  <div style="height:44px;"></div>

  <!-- header: unchanged from the shipped Owned side -->
  <div style="padding:24px 24px 0;display:flex;align-items:flex-start;justify-content:space-between;">
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div class="disp" style="font-size:30px;line-height:36px;">Items</div>
      <div class="lbl">31 items · $16,020</div>
    </div>
    <div style="display:flex;gap:8px;">
      <div class="badge">
        <span style="display:flex;flex-direction:column;gap:2.5px;"><span style="width:10px;height:1.5px;background:currentColor;"></span><span style="width:7px;height:1.5px;background:currentColor;"></span><span style="width:4px;height:1.5px;background:currentColor;"></span></span>
        <span class="mono" style="font-size:11px;">Value</span>
      </div>
      <div class="badge"><svg width="18" height="14" viewBox="0 0 18 14" fill="currentColor"><circle cx="3" cy="7" r="1.7"/><circle cx="9" cy="7" r="1.7"/><circle cx="15" cy="7" r="1.7"/></svg></div>
    </div>
  </div>

  <!-- the switch, on Owned -->
  <div style="padding:16px 24px 0;">
    <div class="sw"><span class="on">Owned</span><span class="off">Sold</span></div>
  </div>

  <div style="padding:24px 24px 0;">
    <div class="plate" style="height:40px;display:flex;align-items:center;gap:10px;padding:0 14px;">
      <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="rgba(242,237,228,0.4)" stroke-width="1.8"><circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/></svg>
      <span style="font-size:13.5px;color:rgba(242,237,228,0.3);">Search name or serial</span>
    </div>
  </div>

  <div style="padding:16px 0 0 24px;display:flex;gap:8px;overflow:hidden;">
    <span class="chip on">All</span><span class="chip">Cameras</span><span class="chip">Lenses</span><span class="chip">Guitars</span><span class="chip">Amps</span>
  </div>

  <div style="padding:15px 11px 0;display:flex;flex-direction:column;gap:10px;">
    <div class="plate row">
      <div class="thumb"><svg class="pic" viewBox="28 22 64 76" preserveAspectRatio="xMidYMid slice"><use href="#hb" width="120" height="120"/></svg></div>
      <div class="rbody">
        <div class="rtitle">Leica M6 (0.72x)</div>
        <div class="lbl">Photography · Cameras</div>
        <div class="rvalue"><span class="money">$3,450</span><span class="meta" style="color:#7E9679;">+$550 vs paid</span></div>
      </div>
      <div class="dial"><svg width="36" height="36" viewBox="0 0 36 36"><path d="M8.1 27.9 A14 14 0 1 1 27.9 27.9" fill="none" stroke="rgba(242,237,228,0.14)" stroke-width="2.5" stroke-linecap="round"/><path d="M8.1 27.9 A14 14 0 1 1 27.9 27.9" fill="none" stroke="#7E9679" stroke-width="2.5" stroke-linecap="round"/><circle cx="27.9" cy="27.9" r="2.2" fill="#7E9679"/></svg><span style="color:#7E9679;">5</span></div>
    </div>
    <div class="plate row">
      <div class="thumb"><svg class="pic" viewBox="20 30 80 66" preserveAspectRatio="xMidYMid slice"><use href="#lens" width="120" height="120"/></svg></div>
      <div class="rbody">
        <div class="rtitle">Nikon 105mm f/2.5 Ai-S</div>
        <div class="lbl">Photography · Lenses</div>
        <div class="rvalue"><span class="money">$310</span><span class="meta" style="color:#7E9679;">+$70 vs paid</span></div>
      </div>
      <div class="dial"><svg width="36" height="36" viewBox="0 0 36 36"><path d="M8.1 27.9 A14 14 0 1 1 27.9 27.9" fill="none" stroke="rgba(242,237,228,0.14)" stroke-width="2.5" stroke-linecap="round"/><path d="M8.1 27.9 A14 14 0 1 1 30.93 12.64" fill="none" stroke="#7E9679" stroke-width="2.5" stroke-linecap="round"/><circle cx="30.93" cy="12.64" r="2.2" fill="#7E9679"/></svg><span style="color:#7E9679;">4</span></div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    helmet{display:none!important;}
    x-dc{display:block;}
    body{background:#17181A;font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;color:#F2EDE4;-webkit-font-smoothing:antialiased;}
    a{color:#C79A56;text-decoration:none;}
    a:hover{color:#DDB877;}
    .frame{width:390px;background:#17181A;position:relative;overflow:hidden;display:flex;flex-direction:column;}
    .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;}
    .disp{font-family:'Archivo',system-ui,sans-serif;font-weight:600;}
    .lbl{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;font-weight:500;font-size:10.5px;line-height:14px;letter-spacing:1.2px;text-transform:uppercase;color:rgba(242,237,228,0.6);white-space:nowrap;}
    .badge{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid #C79A56;border-radius:3px;color:#C79A56;}
    .sw{display:inline-flex;height:32px;border:1px solid #C79A56;border-radius:3px;overflow:hidden;}
    .sw span{width:62px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;font-size:11px;}
    .sw .on{background:#C79A56;color:#17181A;font-weight:500;}
    .sw .off{color:#C79A56;}
  </style>
</helmet>

<div class="frame" style="height:844px;">
  <div style="height:44px;flex:none;"></div>

  <div style="padding:24px 24px 0;display:flex;align-items:flex-start;justify-content:space-between;flex:none;">
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div class="disp" style="font-size:30px;line-height:36px;">Items</div>
      <div class="lbl">0 sold · $0</div>
    </div>
    <div class="badge"><svg width="18" height="14" viewBox="0 0 18 14" fill="currentColor"><circle cx="3" cy="7" r="1.7"/><circle cx="9" cy="7" r="1.7"/><circle cx="15" cy="7" r="1.7"/></svg></div>
  </div>

  <div style="padding:16px 24px 0;flex:none;">
    <div class="sw"><span class="off">Owned</span><span class="on">Sold</span></div>
  </div>

  <!-- EmptyStateView as shipped: centred, a little above true centre, no action -->
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 24px 48px;">
    <div style="padding-bottom:4px;">
      <svg width="38" height="38" viewBox="0 0 38 38" fill="none" stroke="rgba(242,237,228,0.3)" stroke-width="1.5" stroke-linejoin="round"><path d="M20.5 4.5H32a1.5 1.5 0 0 1 1.5 1.5v11.5L17.8 33.2a2 2 0 0 1-2.8 0L4.8 23a2 2 0 0 1 0-2.8Z"/><circle cx="27" cy="11" r="2.4"/></svg>
    </div>
    <div class="disp" style="font-size:19px;line-height:24px;text-align:center;">Nothing sold yet.</div>
    <div style="font-size:13.5px;line-height:20px;color:rgba(242,237,228,0.4);text-align:center;max-width:300px;">Mark an item as sold from its page or from a sell plan.</div>
  </div>
</div>
</x-dc>
</body>
</html>

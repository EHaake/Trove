<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    helmet{display:none!important;}
    x-dc{display:block;}
    body{background:#17181A;font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;color:#F2EDE4;-webkit-font-smoothing:antialiased;}
    a{color:#C79A56;text-decoration:none;}
    a:hover{color:#DDB877;}
    .frame{width:390px;background:#17181A;position:relative;overflow:hidden;}
    .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;}
    .disp{font-family:'Archivo',system-ui,sans-serif;font-weight:600;}
    .lbl{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;font-weight:500;font-size:10.5px;line-height:14px;letter-spacing:1.2px;text-transform:uppercase;color:rgba(242,237,228,0.6);white-space:nowrap;}
    .meta{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;font-size:11.5px;line-height:16px;white-space:nowrap;}
    .money{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;font-size:15px;line-height:20px;font-weight:500;white-space:nowrap;}
    .plate{background:#201F1D;border-radius:3px;box-shadow:inset 0 1px 0 rgba(242,237,228,0.055),inset 0 -1px 0 rgba(0,0,0,0.4),0 2px 6px rgba(0,0,0,0.25);}
    .badge{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid #C79A56;border-radius:3px;color:#C79A56;}
    .sw{display:inline-flex;height:32px;border:1px solid #C79A56;border-radius:3px;overflow:hidden;}
    .sw span{width:62px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;font-size:11px;}
    .sw .on{background:#C79A56;color:#17181A;font-weight:500;}
    .sw .off{color:#C79A56;}
    .row{display:flex;align-items:center;gap:13px;padding:13px;}
    .thumb{position:relative;width:52px;height:52px;flex:0 0 52px;border-radius:2px;overflow:hidden;background:#26272A;display:flex;align-items:center;justify-content:center;}
    .thumb .pic{position:absolute;inset:0;width:100%;height:100%;}
    .mark{position:absolute;top:4px;left:4px;width:16px;height:16px;border-radius:3px;background:rgba(23,24,26,0.9);border:1px solid rgba(242,237,228,0.16);display:flex;align-items:center;justify-content:center;}
    .rbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
    .rtitle{font-size:15px;font-weight:500;line-height:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .rvalue{display:flex;align-items:baseline;gap:8px;}
  </style>
</helmet>

<div class="frame" style="height:430px;">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="tt" viewBox="0 0 120 120"><rect x="12" y="18" width="96" height="84" rx="4" fill="#2a2722"/><circle cx="54" cy="60" r="34" fill="#18171b"/><circle cx="54" cy="60" r="34" fill="none" stroke="#3a3a3c" stroke-width="1.5"/><circle cx="54" cy="60" r="12" fill="#b58a4a"/><circle cx="96" cy="30" r="6" fill="#3a3940"/><path d="M96 30 L64 66" stroke="#8a8a90" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="mk" viewBox="0 0 16 16"><rect x="2.4" y="5" width="8.4" height="7" rx="1.4" fill="none" stroke="rgba(242,237,228,0.72)" stroke-width="1.4" stroke-linejoin="round"/><path d="M5.3 5V3.6A1.1 1.1 0 0 1 6.4 2.5h6A1.1 1.1 0 0 1 13.5 3.6v6A1.1 1.1 0 0 1 12.4 10.7h-1.6" fill="none" stroke="rgba(242,237,228,0.72)" stroke-width="1.4" stroke-linejoin="round"/></symbol>
    <symbol id="amp" viewBox="0 0 120 120"><rect x="14" y="26" width="92" height="70" rx="4" fill="#3a2e22"/><rect x="14" y="26" width="92" height="16" rx="3" fill="#2a221a"/><rect x="20" y="46" width="80" height="44" rx="2" fill="#1c1a17"/><path d="M20 52h80M20 58h80M20 64h80M20 70h80M20 76h80M20 82h80" stroke="#2e2a24" stroke-width="1.4"/><circle cx="30" cy="34" r="3" fill="#b58a4a"/><circle cx="42" cy="34" r="3" fill="#b58a4a"/><circle cx="54" cy="34" r="3" fill="#b58a4a"/><circle cx="66" cy="34" r="3" fill="#b58a4a"/><rect x="48" y="20" width="24" height="6" rx="2" fill="#26221e"/></symbol>
  </defs></svg>

  <div style="height:44px;"></div>

  <!-- Sold side header: Sort By and search are gone; the "…" stays -->
  <div style="padding:24px 24px 0;display:flex;align-items:flex-start;justify-content:space-between;">
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div class="disp" style="font-size:30px;line-height:36px;">Items</div>
      <div class="lbl">3 sold · $2,400 · <span style="color:#7E9679;">+$200 vs paid</span></div>
    </div>
    <div class="badge"><svg width="18" height="14" viewBox="0 0 18 14" fill="currentColor"><circle cx="3" cy="7" r="1.7"/><circle cx="9" cy="7" r="1.7"/><circle cx="15" cy="7" r="1.7"/></svg></div>
  </div>

  <!-- the switch, on Sold -->
  <div style="padding:16px 24px 0;">
    <div class="sw"><span class="off">Owned</span><span class="on">Sold</span></div>
  </div>

  <div style="padding:15px 11px 0;display:flex;flex-direction:column;gap:10px;">
    <div class="plate row">
      <div class="thumb"><svg class="pic" viewBox="8 18 104 84" preserveAspectRatio="xMidYMid slice"><use href="#tt" width="120" height="120"/></svg><div class="mark"><svg width="10" height="10" viewBox="0 0 16 16"><use href="#mk"/></svg></div></div>
      <div class="rbody">
        <div class="rtitle">Technics SL-1200</div>
        <div class="lbl">Sold Sep 12, 2026</div>
        <div class="rvalue"><span class="money">$1,200</span><span class="meta" style="color:#7E9679;">Gain $350 vs paid</span></div>
      </div>
    </div>
    <div class="plate row">
      <div class="thumb"><svg width="17" height="14" viewBox="0 0 17 14" fill="none" stroke="rgba(242,237,228,0.3)" stroke-width="1"><rect x="0.5" y="0.5" width="16" height="13" rx="2"/><circle cx="5" cy="4.5" r="1.4"/><path d="M1 12l4.5-4.5 3 3 2.5-2.5 5 5"/></svg></div>
      <div class="rbody">
        <div class="rtitle">Vox AC15C1</div>
        <div class="lbl">Sold Sep 3, 2026</div>
        <div class="rvalue"><span class="money">$660</span><span class="meta" style="color:rgba(242,237,228,0.55);">At cost</span></div>
      </div>
    </div>
    <div class="plate row">
      <div class="thumb"><svg class="pic" viewBox="10 18 100 84" preserveAspectRatio="xMidYMid slice"><use href="#amp" width="120" height="120"/></svg></div>
      <div class="rbody">
        <div class="rtitle">Fender Blues Junior IV</div>
        <div class="lbl">Sold Aug 30, 2026</div>
        <div class="rvalue"><span class="money">$540</span><span class="meta" style="color:#B8674F;">Loss $150 vs paid</span></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>

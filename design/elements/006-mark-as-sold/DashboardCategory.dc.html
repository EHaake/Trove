<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    helmet{display:none!important;}
    x-dc{display:block;}
    body{background:#17181A;font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;color:#F2EDE4;-webkit-font-smoothing:antialiased;}
    a{color:#C79A56;text-decoration:none;}
    a:hover{color:#DDB877;}
    .frame{width:390px;background:#17181A;position:relative;overflow:hidden;}
    .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;}
    .disp{font-family:'Archivo',system-ui,sans-serif;font-weight:600;}
    .lbl{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;font-weight:500;font-size:10.5px;line-height:14px;letter-spacing:1.2px;text-transform:uppercase;color:rgba(242,237,228,0.6);white-space:nowrap;}
    .meta{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;font-size:11.5px;line-height:16px;white-space:nowrap;}
    .money{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;font-size:15px;line-height:20px;font-weight:500;white-space:nowrap;}
    .plate{background:#201F1D;border-radius:3px;box-shadow:inset 0 1px 0 rgba(242,237,228,0.055),inset 0 -1px 0 rgba(0,0,0,0.4),0 2px 6px rgba(0,0,0,0.25);}
    .brow{display:flex;align-items:center;gap:16px;padding:13px 0;}
    .brow .sw3{width:3px;align-self:stretch;}
    .brow .name{font-size:15px;font-weight:500;line-height:19px;}
    .hair{height:1px;background:#3A3B3E;}
  </style>
</helmet>

<div class="frame" style="height:880px;">
  <div style="height:44px;"></div>
  <!-- system navigation bar on a drilled-in scope -->
  <div style="height:52px;display:flex;align-items:center;padding:0 16px;">
    <svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="#C79A56" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>
  </div>

  <div style="padding:24px 24px 40px;display:flex;flex-direction:column;gap:24px;">
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div class="disp" style="font-size:30px;line-height:36px;">Audio</div>
      <div class="lbl">6 items · 3 categories</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px;">
      <div class="lbl">Current value</div>
      <div style="display:flex;align-items:flex-start;gap:4px;">
        <div class="disp" style="font-size:28px;line-height:1;color:#C79A56;padding-top:10px;">$</div>
        <div class="disp" style="font-size:68px;line-height:1;letter-spacing:-0.01em;color:#C79A56;">2,340</div>
      </div>
      <svg width="263" height="14" viewBox="0 0 263 14"><g fill="#C79A56"><rect x="0" y="0" width="2" height="14"/><rect x="9" y="5" width="2" height="9"/><rect x="18" y="5" width="2" height="9"/><rect x="27" y="5" width="2" height="9"/><rect x="36" y="5" width="2" height="9"/><rect x="45" y="0" width="2" height="14"/><rect x="54" y="5" width="2" height="9"/><rect x="63" y="5" width="2" height="9"/><rect x="72" y="5" width="2" height="9"/><rect x="81" y="5" width="2" height="9"/><rect x="90" y="0" width="2" height="14"/><rect x="99" y="5" width="2" height="9"/><rect x="108" y="5" width="2" height="9"/><rect x="117" y="5" width="2" height="9"/><rect x="126" y="5" width="2" height="9"/><rect x="135" y="0" width="2" height="14"/><rect x="144" y="5" width="2" height="9"/><rect x="153" y="5" width="2" height="9"/><rect x="162" y="5" width="2" height="9"/><rect x="171" y="5" width="2" height="9"/><rect x="180" y="0" width="2" height="14"/><rect x="189" y="5" width="2" height="9"/><rect x="198" y="5" width="2" height="9"/><rect x="207" y="5" width="2" height="9"/><rect x="216" y="5" width="2" height="9"/><rect x="225" y="0" width="2" height="14"/><rect x="234" y="5" width="2" height="9"/><rect x="243" y="5" width="2" height="9"/><rect x="252" y="5" width="2" height="9"/><rect x="261" y="5" width="2" height="9"/></g></svg>
    </div>

    <div class="plate" style="display:flex;padding:16px;">
      <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
        <div class="lbl">Spent</div>
        <div class="disp" style="font-size:26px;line-height:31px;">$2,105</div>
      </div>
      <div style="width:1px;background:#3A3B3E;margin:4px 0;"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:6px;padding-left:16px;">
        <div class="lbl">Gain</div>
        <div style="display:flex;align-items:baseline;gap:6px;">
          <div class="disp" style="font-size:26px;line-height:31px;color:#7E9679;">+$235</div>
          <svg width="9" height="9" viewBox="0 0 10 10" fill="#7E9679"><path d="M5 1.5 9.5 8.5H.5Z"/></svg>
        </div>
      </div>
    </div>

    <!-- the Sold card follows the scope: only what was sold from Audio -->
    <div class="plate" style="display:flex;align-items:center;gap:16px;padding:16px;">
      <div style="flex:1;display:flex;flex-direction:column;">
        <div class="lbl">Sold</div>
        <div class="mono" style="margin-top:6px;font-size:15px;line-height:20px;color:rgba(242,237,228,0.75);white-space:nowrap;">1 item · <span style="font-weight:500;color:#F2EDE4;">$1,200</span></div>
        <div class="meta" style="margin-top:4px;color:#7E9679;">+$350 vs paid</div>
      </div>
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#C79A56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 6h9M7 2.5 10.5 6 7 9.5"/></svg>
    </div>

    <div style="display:flex;flex-direction:column;gap:16px;">
      <div style="display:flex;justify-content:space-between;">
        <div class="lbl">By category</div>
        <div class="lbl" style="color:rgba(242,237,228,0.4);">By value</div>
      </div>
      <div style="display:flex;gap:2px;height:6px;">
        <div style="flex:45;background:#C79A56;border-radius:3px;"></div>
        <div style="flex:33;background:#9C4A34;border-radius:3px;"></div>
        <div style="flex:22;background:#52634F;border-radius:3px;"></div>
      </div>
      <div>
        <div class="brow"><div class="sw3" style="background:#C79A56;"></div><div style="flex:1;display:flex;flex-direction:column;gap:4px;"><div class="name">Turntables</div><div class="lbl">2 items · 45%</div></div><div class="money">$1,050</div></div>
        <div class="hair"></div>
        <div class="brow"><div class="sw3" style="background:#9C4A34;"></div><div style="flex:1;display:flex;flex-direction:column;gap:4px;"><div class="name">Headphones</div><div class="lbl">3 items · 33%</div></div><div class="money">$780</div></div>
        <div class="hair"></div>
        <div class="brow"><div class="sw3" style="background:#52634F;"></div><div style="flex:1;display:flex;flex-direction:column;gap:4px;"><div class="name">Speakers</div><div class="lbl">1 item · 22%</div></div><div class="money">$510</div></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
